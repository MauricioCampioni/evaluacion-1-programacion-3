<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Registro</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="container">
        <form class="login-form" id="form-registro">
            <h1>FOOD STORE</h1>
            <h2>Crear Cuenta</h2>

            <label for="reg-email">Email:</label>
            <input type="email" id="reg-email" placeholder="Ingrese su email" required>

            <label for="reg-password">Contraseña:</label>
            <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required>

            <button type="submit">Registrarse</button>

            <p class="registro">
                ¿Ya tenés cuenta? <a href="login.html">Iniciá Sesión acá</a>
            </p>
        </form>
    </div>
    <script type="module" src="src/main.ts"></script>
    <script type="module" src="src/pages/auth/registro/registro.ts"></script>
</body>
</html>
