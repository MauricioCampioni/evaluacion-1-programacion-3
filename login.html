<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="container">
        <form class="login-form" id="form-login">
            <h1>FOOD STORE</h1>
            <h2>Iniciar Sesión</h2>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Ingrese su email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>

            <button type="submit">Iniciar Sesión</button>

            <p class="registro">
                ¿No tenes una cuenta? <a href="registro.html">Regístrate acá</a>
            </p>
        </form>
    </div>     
    <script type="module" src="src/main.ts"></script>
    <script type="module" src="src/pages/auth/login/login.ts"></script>
</body>
</html>
